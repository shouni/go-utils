# CI の実体は shouni/workflows。ジョブ構成とタグ運用の理由はそちらの README にある。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      # jobid の検証はセキュリティ境界（URL とストレージのパスに直接載る）。
      # 手書きのバイト走査なので、表のテストではなく探索で埋める。
      fuzz-targets: "./jobid#FuzzSanitize ./jobid#FuzzCreatedAt"
      fuzz-time: 60s
