# The CI itself lives in shouni/workflows; its README explains the job layout and tag policy.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      # jobid validation is a security boundary (IDs go straight into URL and storage paths).
      # It is a hand-written byte scan, so it is covered by fuzzing rather than table tests.
      fuzz-targets: "./jobid#FuzzSanitize ./jobid#FuzzCreatedAt"
      fuzz-time: 60s
