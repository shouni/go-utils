# 実体は shouni/workflows が持つ。ジョブの構成・govulncheck の起動方法・
# check-latest を付ける理由は、そちらの README.md「設計の判断」にある。
#
# ref は不変のタグで固定する。移動タグ（@v1 の張り替え）にすると Dependabot に
# 上げるものが無くなり、全消費側が次の実行でいきなり新しい内容を引くため。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1.0.0
